version: '3'

services:
  postgres:
    image: postgres:15
    hostname: postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    hostname: azurite
    ports:
      - '10000:10000'
      - '10001:10001'
      - '10002:10002'

  pbmhost:
    image: webpapitemplate-app:latest
    hostname: pbm-host
    ports:
      - '9110:9110'
      - '8080:80'
      - '8079:443'
    environment:
      ASPNETCORE_ENVIRONMENT: Azure
      ConnectionStrings__PostgreSql: "Host=postgres;Port=5432;Database=tracker;Username=postgres;Password=postgres"
      ConnectionStrings__Azurite: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      AkkaSettings__AkkaManagementOptions__Port: "8558"
      AkkaSettings__RemoteOptions__Port: "8557"
      AkkaSettings__PersistenceMode: "PostgreSql"
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started

  hosts:
    image: webpapitemplate-app:latest
    deploy:
      replicas: 3
    environment:
      ASPNETCORE_ENVIRONMENT: Azure
      ConnectionStrings__PostgreSql: "Host=postgres;Port=5432;Database=tracker;Username=postgres;Password=postgres"
      ConnectionStrings__Azurite: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      AkkaSettings__AkkaManagementOptions__Port: "8558"
      AkkaSettings__RemoteOptions__Port: "8557"
      AkkaSettings__PersistenceMode: "PostgreSql"
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started

volumes:
  postgres_data:
